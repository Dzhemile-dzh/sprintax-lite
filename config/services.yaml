# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.pdf.templates_dir: '%kernel.project_dir%/resources/pdf'
    app.pdf.output_dir: '%kernel.project_dir%/var/pdf'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Domain\Calculation\Contract\CalculatorInterface:
            tags: ['app.calculator']

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Domain/**/Entity/'
            - '../src/Domain/**/ValueObject/'
            - '../src/Domain/**/DTO/'
            - '../src/Domain/**/Exception/'
            - '../src/Infrastructure/Persistence/Doctrine/Type/'
            - '../src/Infrastructure/Messenger/Message/'

    App\Application\Calculation\CalculateSubmission:
        arguments:
            $calculators: !tagged_iterator app.calculator

    App\Application\Calculation\ListCalculatorFields:
        arguments:
            $calculators: !tagged_iterator app.calculator

    App\Application\Pdf\GenerateSubmissionPdf:
        arguments:
            $templatesDirectory: '%app.pdf.templates_dir%'
            $outputDirectory: '%app.pdf.output_dir%'

    App\Application\Pdf\EmailSubmissionPdf:
        arguments:
            $outputDirectory: '%app.pdf.output_dir%'

    App\Application\Pdf\DownloadSubmissionPdf:
        arguments:
            $outputDirectory: '%app.pdf.output_dir%'

    App\Application\Pdf\SubmissionPdfMailer:
        alias: App\Infrastructure\Mail\SymfonySubmissionPdfMailer

    App\Infrastructure\Mail\SymfonySubmissionPdfMailer:
        arguments:
            $fromAddress: '%env(MAILER_FROM)%'

    App\Domain\Filesystem\Contract\FileStorageInterface:
        alias: App\Infrastructure\Filesystem\LocalFileStorage

    App\Domain\Pdf\Contract\PdfGeneratorInterface:
        alias: App\Infrastructure\Pdf\FpdiPdfGenerator

    App\Domain\Questionnaire\Repository\QuestionnaireRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineQuestionnaireRepository
        public: true

    App\Domain\Submission\Repository\SubmissionRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineSubmissionRepository
        public: true

    App\Domain\User\Repository\UserRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineUserRepository
        public: true

    App\Application\User\PasswordHasherInterface:
        alias: App\Infrastructure\Security\SymfonyPasswordHasher

    Doctrine\DBAL\Driver\AbstractSQLiteDriver\Middleware\EnableForeignKeys:
        tags:
            - { name: doctrine.middleware }
