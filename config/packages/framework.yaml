framework:
    secret: '%env(APP_SECRET)%'

    session:
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax

    rate_limiter:
        registration:
            policy: 'fixed_window'
            limit: 5
            interval: '15 minutes'
            lock_factory: null

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
            cookie_secure: auto
            cookie_httponly: true
            cookie_samesite: lax
        rate_limiter:
            registration:
                policy: 'fixed_window'
                limit: 1000
                interval: '1 minute'
                lock_factory: null
