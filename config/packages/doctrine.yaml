doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        types:
            email: App\Infrastructure\Persistence\Doctrine\Type\EmailType
            question_validation: App\Infrastructure\Persistence\Doctrine\Type\QuestionValidationType
            visibility_rule: App\Infrastructure\Persistence\Doctrine\Type\VisibilityRuleType
            answer_value: App\Infrastructure\Persistence\Doctrine\Type\AnswerValueType
            pdf_coordinates: App\Infrastructure\Persistence\Doctrine\Type\PdfCoordinatesType
            datetime_immutable: App\Infrastructure\Persistence\Doctrine\Type\UtcDateTimeImmutableType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            Domain:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Domain'
                prefix: 'App\Domain'
                alias: Domain

when@test:
    doctrine:
        dbal:
            # SQLite uses a dedicated file from .env.test; do not append a suffix.
            dbname_suffix: ''

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
