name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, and analyse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      APP_DEBUG: '1'
      APP_SECRET: test-secret
      MESSENGER_TRANSPORT_DSN: 'doctrine://default?auto_setup=1'
      DEFAULT_URI: 'http://localhost'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, mbstring, pdo_sqlite, sqlite3
          coverage: none
          ini-values: memory_limit=512M

      - name: Install Composer dependencies
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress

      - name: Lint Symfony configuration
        run: |
          composer lint
          php bin/console lint:container --env=prod

      - name: Check PHP syntax
        run: find src tests migrations -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHPUnit
        run: composer test

      - name: Warm up cache and run PHPStan
        run: |
          php bin/console cache:warmup --env=dev --no-interaction
          composer phpstan

      - name: Validate Doctrine mapping and migrations
        env:
          DATABASE_URL: 'sqlite:///%kernel.project_dir%/var/ci.db'
        run: |
          mkdir -p var
          php bin/console doctrine:migrations:migrate --no-interaction --env=test
          php bin/console doctrine:schema:validate --env=test
          php bin/console doctrine:migrations:up-to-date --env=test
