services:
  app:
    build: .
    ports:
      - "8080:80"
    environment: &app-environment
      # Local defaults. Do not publish port 8080 on a shared network with these values.
      # Profiler and WDT require ROLE_ADMIN. For a shared demo use APP_ENV=prod, APP_DEBUG=0,
      # and a unique APP_SECRET.
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_SECRET: ${APP_SECRET:-change-me-local-only}
      DATABASE_URL: sqlite:////var/www/html/var/data/app.db
      DEFAULT_URI: http://localhost:8080
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=1
      # Hardcoded to the compose Mailpit service so a host 127.0.0.1 DSN cannot leak in.
      MAILER_DSN: smtp://mailer:1025
      MAILER_FROM: ${MAILER_FROM:-noreply@localhost}
    volumes: &app-volumes
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - sqlite_data:/var/www/html/var/data
    command: ["docker-entrypoint-app"]
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\",80)?0:1);'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 300s

  mailer:
    image: axllent/mailpit:v1.31.0
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  worker:
    build: .
    environment: *app-environment
    volumes: *app-volumes
    depends_on:
      - app
      - mailer
    init: true
    restart: unless-stopped
    command: ["docker-entrypoint-worker"]

volumes:
  vendor_data:
  sqlite_data:
